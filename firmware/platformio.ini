; Pêndulo invertido com roda de reação - WeAct Black Pill STM32F411CEU6
;
;   pio run                 compila o firmware
;   pio run -t upload       grava pelo ST-Link (SWD)
;   pio test -e native      roda os testes da lógica de controle no PC
;   pio device monitor      telemetria pelo próprio cabo USB-C (porta serial virtual,
;                           /dev/ttyACM0 no Linux, COMx no Windows)

[platformio]
default_envs = blackpill_f411ce

[env]
test_framework = unity

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
board_build.f_cpu = 96000000L
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 460800   ; no USB a velocidade não importa; fica por compatibilidade
build_flags =
    -O2
    -DHSE_VALUE=25000000U
; avisos do compilador só no código do projeto (a HAL da ST gera vários)
build_src_flags =
    -Wall
    -Wextra
; os testes rodam só no PC
test_ignore = *

; Sem ST-Link: segure BOOT0, aperte NRST, solte BOOT0 e use `pio run -e blackpill_dfu -t upload`
[env:blackpill_dfu]
extends = env:blackpill_f411ce
upload_protocol = dfu

[env:native]
platform = native
build_flags =
    -Wall
    -Wextra
    -lm
